# Builds the API image and pushes it to Amazon ECR (repository kargopazar-api).
# App Runner is configured with automatic deployment on the :latest tag, so every push
# to main that touches the backend, the database scripts or the seed redeploys the API.
#
# Repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user with ECR push),
# ECR_REGISTRY (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com).
name: backend-ecr

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'frontend/src/app/data/seed/**'
      - '.github/workflows/backend-ecr.yml'
  workflow_dispatch:

concurrency:
  group: backend-ecr
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      ECR_REPOSITORY: kargopazar-api
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      # Build context is the repo root: the image embeds frontend/src/app/data/seed/*.json.
      - name: Build & push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker build -f backend/Dockerfile -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Summary
        run: echo "Pushed $IMAGE_URI and :latest (App Runner auto-deploys :latest)" >> $GITHUB_STEP_SUMMARY
