# AWS Amplify custom response headers (monorepo format, app root: frontend).
# Applies to the landing page, the legal pages and the /app/ panel.
#
# CSP notes (see the frontend code before tightening further):
# - script-src 'self': Vite emits only external module scripts; the JSON-LD block in index.html is a
#   data block (type="application/ld+json") and is not executed, so it needs no hash.
# - style-src 'unsafe-inline': Vue :style bindings, inline <style> in the label SVG previews (v-html)
#   and the standalone 404.html.
# - font-src data:: the label SVG previews embed Noto Sans as data: URLs.
# - img-src data: blob:: barcodes / QR codes (canvas data URLs) and label SVG previews.
# - frame-src blob:: PDF previews (manifests, customs documents, labels) are jsPDF blobs shown in
#   an <iframe> (src/app/docs/pdf.js toBlobUrl / printDoc).
# - connect-src: the App Runner API (frontend/.env.production) and the future api.kargopazar.com.
applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=()'
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://mzzf2rnkui.us-east-1.awsapprunner.com https://api.kargopazar.com; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
